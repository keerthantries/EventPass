name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /health
        run: |
          curl --silent --show-error --fail \
            --max-time 120 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            https://eventpass-backend-tuch.onrender.com/health
